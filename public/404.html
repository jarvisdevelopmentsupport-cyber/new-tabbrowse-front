<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — TaskFlow</title>
<style>
  :root { --void:#0b0b12; --text:#f8fafc; --muted:#8b8fa8; --primary:#9333ea; --accent:#22d3ee; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(700px 340px at 50% -10%, rgba(147,51,234,.2), transparent 70%), var(--void);
    color:var(--text); }
  .card { text-align:center; padding:3rem; }
  .code { font-size:4.5rem; font-weight:800; letter-spacing:-.03em;
    background:linear-gradient(100deg,#22d3ee,#9333ea 45%,#f0abfc 75%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 { font-size:1.25rem; margin:.6rem 0 .4rem; }
  p { color:var(--muted); font-size:.92rem; line-height:1.6; }
  a { display:inline-block; margin-top:1.4rem; padding:.6rem 1.4rem; border-radius:.6rem;
    background:linear-gradient(100deg,#9333ea,#7c3aed); color:#fff; text-decoration:none; font-weight:600;
    box-shadow:0 8px 24px -10px rgba(147,51,234,.8); }
  a:hover { filter:brightness(1.1); }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist on this site.</p>
    <a href="/">Back to TaskFlow</a>
  </div>
</body>
</html>
