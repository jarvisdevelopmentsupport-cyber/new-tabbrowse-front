
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 15px 20px;
            background: #1b1b1b;
            border-bottom: 1px solid #333;
            font-size: 18px;
            font-weight: bold;
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 25px;
            background: #111;
            color: white;
            border: none;
            outline: none;
            resize: none;
            font-family: monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        textarea::placeholder {
            color: #555;
        }

        footer {
            padding: 10px 20px;
            background: #1b1b1b;
            border-top: 1px solid #333;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>Notepad</header>

    <textarea id="notes" placeholder="Start writing..."></textarea>

    <footer id="status">Ready</footer>

    <script>
        const notes = document.getElementById("notes");
        const status = document.getElementById("status");

        // Load saved notes
        notes.value = localStorage.getItem("myNotes") || "";

        // Automatically save when typing
        notes.addEventListener("input", () => {
            localStorage.setItem("myNotes", notes.value);
            status.textContent = "Saved";
        });
    </script>

</body>
</html>
